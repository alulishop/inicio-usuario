<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion | Aluli Shop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-page">
        <div class="cuadrado-auth">
            <div class="logo-auth">Aluli<span>Shop</span></div>
            <h2 id="auth-title">Iniciar Sesión</h2>
            <p id="auth-subtitle">Para Ver catalogo</p>

            <form id="auth-form">
                <div class="input-group">
                    <input type="text" id="user" placeholder="Nombre de usuario" required>
                </div>
                <div class="input-group">
                    <input type="password" id="pass" placeholder="Contraseña" required>
                </div>
                <div id="msg-usuario" class="mensaje-alerta"></div>
                <button type="submit" id="btn-text" class="btn-primary">Entrar</button>
            </form>

            <div class="switch-form">
                <p id="toggle-msg">¿No tienes cuenta? <span onclick="toggleMode()">Regístrate aquí</span></p>
            </div>
            
            <a href="https://alulishop.github.io/principal/" class="back-link">← Volver al inicio</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
